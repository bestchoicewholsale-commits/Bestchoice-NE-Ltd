<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BestChoice Wholesale</title><style>:root{--green:#16803c;--dark:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f6f7f9}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#101828}.top{background:var(--dark);color:white;text-align:center;padding:9px 12px;font-size:13px}.hero{background:#fff;border-bottom:1px solid var(--line);padding:20px 16px}.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:4px}.cart{border:0;background:var(--green);color:white;border-radius:12px;padding:11px 14px;font-weight:800}.tools{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px}.tabs{display:flex;gap:8px;overflow:auto;margin-top:10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px}.tab.active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column}.pic{height:170px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;overflow:hidden}.pic img{max-width:100%;max-height:100%;object-fit:contain}.fallback{font-size:42px}.name{font-weight:800;margin-top:10px}.pack{font-size:13px;color:var(--muted);margin:4px 0 8px}.price{font-weight:900;font-size:18px}.row{display:flex;gap:8px;margin-top:10px}.qty{width:65px;border:1px solid var(--line);border-radius:10px;padding:9px}.add{flex:1;background:var(--green);color:#fff;border:0;border-radius:10px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:50px 10px}.drawer{position:fixed;inset:0;background:#0006;display:none;z-index:20}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(430px,94%);background:#fff;padding:18px;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:10px;padding:8px}.item{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;gap:10px}.send{width:100%;padding:14px;background:var(--green);color:white;border:0;border-radius:12px;font-weight:900;margin-top:12px}</style></head><body><div class="top">Wholesale ordering • Orders sent directly to WhatsApp</div><header class="hero"><div class="wrap head"><div><div class="logo">BestChoice Wholesale</div><div class="sub">Drinks • Sweets • Toys</div></div><button class="cart" id="cartBtn">Cart 0</button></div></header><section class="tools"><div class="wrap"><input id="search" class="search" placeholder="Search products..."><div class="tabs" id="tabs"></div></div></section><main class="wrap"><div id="grid" class="grid"></div></main><div id="drawer" class="drawer"><div class="panel"><button class="close" id="close">Close</button><h2>Your order</h2><div id="cartItems"></div><label>Shop / customer name<input id="customer" class="search" style="margin-top:6px"></label><button class="send" id="send">Send order on WhatsApp</button></div></div><script>
const WA='447445264674';let products=[];let cart={};let cat='All products';
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function init(){products=await fetch('products.json?v='+Date.now()).then(r=>r.json());renderTabs();render()}
function renderTabs(){const cats=['All products',...new Set(products.map(p=>p.cat))];$('tabs').innerHTML=cats.map(c=>`<button class="tab ${c===cat?'active':''}" onclick="setCat(${JSON.stringify(c)})">${esc(c)}</button>`).join('')}
function setCat(c){cat=c;renderTabs();render()}
function render(){let q=$('search').value.toLowerCase();let list=products.filter(p=>(cat==='All products'||p.cat===cat)&&(`${p.name} ${p.pack}`.toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}">`:`<div class="fallback">📦</div>`}</div><div class="name">${esc(p.name)}</div><div class="pack">${esc(p.pack||'')}</div><div class="price">${Number(p.price||0)>0?`£${Number(p.price).toFixed(2)}`:`Price to confirm`}</div><div class="row"><input class="qty" type="number" min="1" value="1" id="q-${esc(p.id)}"><button class="add" onclick="add('${esc(p.id)}')">Add</button></div></article>`).join(''):`<div class="empty">No products found.</div>`}
function add(id){let n=Math.max(1,parseInt($('q-'+id).value||1));cart[id]=(cart[id]||0)+n;updateCart();$('cartBtn').animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:180})}
function updateCart(){let count=Object.values(cart).reduce((a,b)=>a+b,0);$('cartBtn').textContent=`Cart ${count}`}
function openCart(){let entries=Object.entries(cart);$('cartItems').innerHTML=entries.length?entries.map(([id,n])=>{let p=products.find(x=>x.id===id);return `<div class="item"><div><b>${esc(p.name)}</b><div class="pack">${esc(p.pack||'')}</div></div><div><b>× ${n}</b><br><button onclick="dec('${id}')">−</button> <button onclick="inc('${id}')">+</button></div></div>`}).join(''):'<p>Your cart is empty.</p>';$('drawer').classList.add('open')}
function inc(id){cart[id]++;openCart();updateCart()}function dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];openCart();updateCart()}
$('search').oninput=render;$('cartBtn').onclick=openCart;$('close').onclick=()=>$('drawer').classList.remove('open');$('send').onclick=()=>{let name=$('customer').value.trim()||'Customer';let lines=['*BestChoice Wholesale Order*','',`Customer: ${name}`,''];Object.entries(cart).forEach(([id,n])=>{let p=products.find(x=>x.id===id);lines.push(`${n} × ${p.name}${Number(p.price||0)>0?` — £${(Number(p.price)*n).toFixed(2)}`:''}`)});let total=Object.entries(cart).reduce((s,[id,n])=>s+Number(products.find(p=>p.id===id).price||0)*n,0);lines.push('',`*Total: £${total.toFixed(2)}*`);location.href=`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`};init();
</script></body></html>
