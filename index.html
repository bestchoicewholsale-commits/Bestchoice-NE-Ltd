<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BestChoice Wholesale</title>
<style>
:root{--green:#16803c;--dark:#111827;--muted:#667085;--line:#e5e7eb;--bg:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#101828}
button,input{font:inherit}.top{background:var(--dark);color:#fff;text-align:center;padding:9px 12px;font-size:13px}
.hero{background:#fff;border-bottom:1px solid var(--line);padding:20px 16px}.wrap{max-width:1100px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:25px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.cart{border:0;background:var(--green);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
.tools{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#101828;border-radius:999px;padding:9px 14px;cursor:pointer;touch-action:manipulation}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:18px 0}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;min-width:0}.pic{height:170px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.fallback{font-size:42px}.name{font-weight:800;margin-top:10px}.pack{font-size:13px;color:var(--muted);margin:4px 0 8px}.price{font-weight:900;font-size:18px}.row{display:flex;gap:8px;margin-top:10px}.qty{width:65px;border:1px solid var(--line);border-radius:10px;padding:9px}.add{flex:1;background:var(--green);color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer}.add.added{background:#0f6b32}
.empty{text-align:center;color:var(--muted);padding:50px 10px;grid-column:1/-1}.error{background:#fff;border:1px solid #f2caca;border-radius:14px;padding:18px;margin-top:18px;color:#9b1c1c}
.drawer{position:fixed;inset:0;background:#0006;display:none;z-index:20}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(430px,94%);background:#fff;padding:18px;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:10px;padding:8px;cursor:pointer}.item{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0;gap:10px}.send{width:100%;padding:14px;background:var(--green);color:#fff;border:0;border-radius:12px;font-weight:900;margin-top:12px;cursor:pointer}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:145px}.name{font-size:14px}.price{font-size:16px}.qty{width:58px}}
</style>
</head>
<body>
<div class="top">Wholesale ordering • Orders sent directly to WhatsApp</div>
<header class="hero"><div class="wrap head"><div><div class="logo">BestChoice Wholesale</div><div class="sub">Drinks • Bags &amp; Household</div></div><button type="button" class="cart" id="cartBtn">Cart 0</button></div></header>
<section class="tools"><div class="wrap"><input id="search" class="search" placeholder="Search products..." autocomplete="off"><div class="tabs" id="tabs"></div></div></section>
<main class="wrap"><div id="grid" class="grid"></div></main>
<div id="drawer" class="drawer"><div class="panel"><button type="button" class="close" id="close">Close</button><h2>Your order</h2><div id="cartItems"></div><label>Shop / customer name<input id="customer" class="search" style="margin-top:6px"></label><button type="button" class="send" id="send">Send order on WhatsApp</button></div></div>
<script>
const WA='447445264674';
let products=[];let cart={};let cat='All products';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]));
function activeProducts(){return products.filter(p=>p.active!==false)}
async function init(){
  try{
    const r=await fetch('products.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('products.json could not be loaded');
    products=await r.json();
    renderTabs();render();
  }catch(e){$('grid').innerHTML='<div class="error"><b>Catalogue could not load.</b><br>Please refresh the page.</div>'}
}
function renderTabs(){
  const cats=['All products',...new Set(activeProducts().map(p=>p.cat))];
  $('tabs').innerHTML=cats.map(c=>`<button type="button" class="tab ${c===cat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
function setCat(c){cat=c;renderTabs();render()}
function render(){
  const q=$('search').value.trim().toLowerCase();
  const list=activeProducts().filter(p=>(cat==='All products'||p.cat===cat)&&(`${p.name} ${p.pack}`.toLowerCase().includes(q)));
  $('grid').innerHTML=list.length?list.map(p=>{
    const qty=cart[p.id]||1;
    const image=p.img?`<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:'';
    return `<article class="card"><div class="pic">${image}<div class="fallback" style="display:${p.img?'none':'block'}">📦</div></div><div class="name">${esc(p.name)}</div><div class="pack">${esc(p.pack)}</div><div class="price">£${Number(p.price).toFixed(2)}</div><div class="row"><input class="qty" type="number" min="1" value="${qty}" data-qty="${esc(p.id)}"><button type="button" class="add ${cart[p.id]?'added':''}" data-add="${esc(p.id)}">${cart[p.id]?`Added ✓ (${cart[p.id]})`:'Add'}</button></div></article>`
  }).join(''):'<div class="empty">No products found.</div>';
}
function add(id){const input=document.querySelector(`[data-qty="${CSS.escape(id)}"]`);const n=Math.max(1,parseInt(input?.value||1,10));cart[id]=(cart[id]||0)+n;updateCart();render()}
function updateCart(){$('cartBtn').textContent=`Cart ${Object.values(cart).reduce((a,b)=>a+b,0)}`}
function openCart(){
  const entries=Object.entries(cart);
  $('cartItems').innerHTML=entries.length?entries.map(([id,n])=>{const p=products.find(x=>x.id===id);return `<div class="item"><div><b>${esc(p.name)}</b><div class="pack">${esc(p.pack)}</div><div>£${(Number(p.price)*n).toFixed(2)}</div></div><div><b>× ${n}</b><br><button type="button" data-dec="${esc(id)}">−</button> <button type="button" data-inc="${esc(id)}">+</button></div></div>`}).join(''):'<p>Your cart is empty.</p>';
  $('drawer').classList.add('open');
}
function inc(id){cart[id]++;updateCart();openCart()}
function dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];updateCart();openCart()}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b)setCat(b.dataset.cat)});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)add(b.dataset.add)});
$('grid').addEventListener('change',e=>{const q=e.target.closest('[data-qty]');if(q){q.value=Math.max(1,parseInt(q.value||1,10));}});
$('search').addEventListener('input',render);
$('cartBtn').addEventListener('click',openCart);
$('close').addEventListener('click',()=>$('drawer').classList.remove('open'));
$('drawer').addEventListener('click',e=>{const b=e.target.closest('[data-inc],[data-dec]');if(!b)return;b.dataset.inc?inc(b.dataset.inc):dec(b.dataset.dec)});
$('send').addEventListener('click',()=>{if(!Object.keys(cart).length)return;const name=$('customer').value.trim()||'Customer';const lines=['*BestChoice Wholesale Order*','',`Customer: ${name}`,''];Object.entries(cart).forEach(([id,n])=>{const p=products.find(x=>x.id===id);lines.push(`${n} × ${p.name} — £${(Number(p.price)*n).toFixed(2)}`)});const total=Object.entries(cart).reduce((s,[id,n])=>s+Number(products.find(p=>p.id===id).price)*n,0);lines.push('',`*Total: £${total.toFixed(2)}*`);location.href=`https://wa.me/${WA}?text=${encodeURIComponent(lines.join('\n'))}`});
init();
</script>
</body></html>
