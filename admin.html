<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BestChoice Admin</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f7f9;margin:0;color:#111827}.wrap{max-width:900px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}h1{margin:0 0 5px}.muted{color:#667085;font-size:14px}input,select,button{font:inherit}.field{display:grid;gap:6px;margin:10px 0}input,select{padding:11px;border:1px solid #d0d5dd;border-radius:10px;width:100%;box-sizing:border-box}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#16803c;color:#fff}.danger{background:#b42318}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.product{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:10px 0}.thumb{width:70px;height:70px;object-fit:contain;border:1px solid #eee;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{padding:10px;border-radius:10px;background:#f2f4f7;margin-top:10px}.small{font-size:12px;color:#667085}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="box"><h1>BestChoice Admin</h1><div class="muted">Edit products here. Changes are saved to the GitHub repository and appear on the public website.</div></div><div class="box"><h2>1. Connect to the website</h2><div class="grid"><div class="field"><label>GitHub username</label><input id="owner" value="ewholesale-commits"></div><div class="field"><label>Repository</label><input id="repo" value="Bestchoice-NE-Ltd"></div></div><div class="field"><label>GitHub fine-grained token</label><input id="token" type="password" placeholder="Paste token here"></div><div class="row"><button class="btn" onclick="connect()">Connect</button><button class="btn" onclick="forget()" style="background:#667085">Forget saved token</button></div><div class="small">The token is kept only in this browser if you choose to save it. Never share it with anyone.</div><div id="status" class="status">Not connected.</div></div><div class="box"><div class="row" style="justify-content:space-between"><h2>2. Products</h2><button class="btn" onclick="newProduct()">+ Add product</button></div><div id="products"></div></div></main><script>
let data=[],connected=false;const $=id=>document.getElementById(id);const key='bestchoice-gh-token';
function status(t){$('status').textContent=t}function apiBase(){return `https://api.github.com/repos/${$('owner').value.trim()}/${$('repo').value.trim()}`}
async function gh(path,opts={}){let r=await fetch(apiBase()+'/contents/'+path,{...opts,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});let j=await r.json();if(!r.ok)throw new Error(j.message||r.status);return j}
async function connect(){try{if(!$('token').value.trim())throw Error('Paste your GitHub token first.');let j=await gh('products.json');data=JSON.parse(atob(j.content.replace(/\n/g,'')));window.sha=j.sha;connected=true;status('Connected. Products loaded.');render()}catch(e){connected=false;status('Could not connect: '+e.message)}}
function render(){if(!data.length){$('products').innerHTML='<p class="muted">No products yet.</p>';return}$('products').innerHTML=data.map((p,i)=>`<div class="product"><div class="row"><div style="flex:1"><div class="grid"><div class="field"><label>Name</label><input value="${attr(p.name)}" onchange="data[${i}].name=this.value"></div><div class="field"><label>Category</label><select onchange="data[${i}].cat=this.value"><option ${p.cat==='Drinks'?'selected':''}>Drinks</option><option ${p.cat==='Sweets'?'selected':''}>Sweets</option><option ${p.cat==='Toys'?'selected':''}>Toys</option></select></div><div class="field"><label>Price (£)</label><input type="number" step="0.01" value="${p.price}" onchange="data[${i}].price=Number(this.value)"></div><div class="field"><label>Pack size</label><input value="${attr(p.pack||'')}" onchange="data[${i}].pack=this.value"></div></div></div></div><div class="row"><button class="btn" onclick="uploadImage(${i})">Change photo</button><button class="btn danger" onclick="removeProduct(${i})">Delete</button><span class="small">${p.img||'No photo'}</span></div></div>`).join('')}
function attr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function newProduct(){data.push({id:String(Date.now()),name:'New product',price:0,pack:'',cat:'Drinks',img:''});render()}
function removeProduct(i){if(confirm('Delete this product?')){data.splice(i,1);render()}}
async function save(){if(!connected)throw Error('Connect first.');let body=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));let r=await gh('products.json',{method:'PUT',body:JSON.stringify({message:'Update products',content:body,sha:window.sha,branch:'main'})});window.sha=r.content.sha;status('Saved. The website will update shortly.')} 
async function uploadImage(i){if(!connected) return alert('Connect first.');let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{let f=inp.files[0];if(!f)return;let ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';let path=`assets/products/${data[i].id}.${ext}`;let b64=await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(f)});try{let old;try{old=await gh(path)}catch{}let payload={message:'Update product photo',content:b64,branch:'main'};if(old?.sha)payload.sha=old.sha;let r=await gh(path,{method:'PUT',body:JSON.stringify(payload)});data[i].img=path;render();await save()}catch(e){alert('Photo upload failed: '+e.message)}};inp.click()}
function forget(){localStorage.removeItem(key);$('token').value='';status('Saved token forgotten from this browser.')}
window.addEventListener('load',()=>{let t=localStorage.getItem(key);if(t)$('token').value=t;render()});$('token').addEventListener('change',()=>{if(confirm('Save the GitHub token in this browser?'))localStorage.setItem(key,$('token').value)});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();save().catch(x=>alert(x.message))}});
const saveBtn=document.createElement('button');saveBtn.className='btn';saveBtn.textContent='Save all changes';saveBtn.onclick=()=>save().catch(e=>alert(e.message));document.querySelectorAll('.box')[2].prepend(saveBtn);
</script></body></html>
